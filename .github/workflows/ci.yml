name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  docker-integration:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Start PostgreSQL, Redis and API
        run: docker compose up --build -d

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color app db redis
          exit 1

      - name: Verify seeded logs
        shell: bash
        run: |
          total=$(curl --fail --silent "http://localhost:3000/api/logs?limit=100" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).total))")
          test "$total" -ge 40

      - name: Verify asynchronous analysis with real Redis and worker
        shell: bash
        run: |
          response=$(curl --fail --silent --request POST http://localhost:3000/api/logs/analyze \
            --header "Content-Type: application/json" \
            --data '{"logIds":["11111111-1111-4111-8111-111111111111"]}')
          analysis_id=$(node -e "console.log(JSON.parse(process.argv[1]).id)" "$response")

          for attempt in $(seq 1 30); do
            status=$(curl --fail --silent "http://localhost:3000/api/analysis/$analysis_id" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).status))")
            if [ "$status" = "COMPLETED" ]; then
              curl --fail --silent "http://localhost:3000/api/analysis/$analysis_id/report"
              exit 0
            fi
            if [ "$status" = "FAILED" ]; then
              echo "Analysis failed"
              curl --silent "http://localhost:3000/api/analysis/$analysis_id"
              exit 1
            fi
            sleep 1
          done

          echo "Analysis did not complete in time"
          curl --silent "http://localhost:3000/api/analysis/$analysis_id"
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color app db redis

      - name: Stop services
        if: always()
        run: docker compose down -v
